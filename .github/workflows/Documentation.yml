name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  build:
    # Docs are built and published from the release repo only. `deploydocs` in docs/make.jl
    # targets cheil/IsoME.jl, so a build started anywhere else publishes into the release
    # repo's gh-pages - pull-request previews included. The dev repo's main is pushed to the
    # release repo verbatim, so both repos always hold this same file: the split has to live
    # in this condition, not in which files exist.
    if: github.repository == 'cheil/IsoME.jl'
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} 
        run: julia --project=docs/ docs/make.jl

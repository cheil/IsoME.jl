name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    # Tags and releases belong to the registered package, which is the release repo. The
    # registry's comments arrive there, and a tag created anywhere else would fire both CI
    # and the docs build through their tag triggers.
    if: >-
      github.repository == 'cheil/IsoME.jl' &&
      (github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot')
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
